<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-password">
        <div class="header">
            <h2>PASSWORD GENERATOR</h2>
        </div>
        <div class="display">
            <input type="text" class="pass-input" placeholder="PASSWORD">
            <button class="copy">COPY</button>
        </div>
        <div class="setting">
            <label id="length-label">Length</label>
            <input type="number" class="length-number" value="10" min="8" max="20" step="1">
        </div>
        <div class="setting">
            <label id="uppercase-label">Uppercase</label>
            <input type="checkbox" id="uppercase" checked>
        </div>
        <div class="setting">
            <label id="lowercase-label">Lowercase</label>
            <input type="checkbox" id="lowercase" checked>
        </div>
        <div class="setting">
            <label id="number-label">Number</label>
            <input type="checkbox" id="number" checked>
        </div>
        <div class="setting">
            <label id="symbol-label">Symbol</label>
            <input type="checkbox" id="symbol" checked>
        </div>
        <div class="generate-btn">
            <button id="generate">GENERATE PASSWORD</button>
        </div>
    </div>

    <script src="web.js"></script>
</body>
</html>
